<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <defs>
    <linearGradient id="bgBedcover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff" />
      <stop offset="100%" stop-color="#f3e8ff" />
    </linearGradient>
    <filter id="shadowBed" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#7e22ce" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="400" height="250" fill="url(#bgBedcover)" />

  <!-- Lavender / Fragrance Flowers in Background -->
  <g opacity="0.4">
    <ellipse cx="60" cy="180" rx="6" ry="12" fill="#c084fc" transform="rotate(-20 60 180)" />
    <ellipse cx="68" cy="170" rx="6" ry="12" fill="#a855f7" transform="rotate(20 68 170)" />
    <ellipse cx="62" cy="160" rx="5" ry="10" fill="#9333ea" />
    <line x1="64" y1="160" x2="60" y2="230" stroke="#16a34a" stroke-width="2" />
    
    <ellipse cx="340" cy="180" rx="6" ry="12" fill="#c084fc" transform="rotate(20 340 180)" />
    <ellipse cx="332" cy="170" rx="6" ry="12" fill="#a855f7" transform="rotate(-20 332 170)" />
    <ellipse cx="338" cy="160" rx="5" ry="10" fill="#9333ea" />
    <line x1="336" y1="160" x2="340" y2="230" stroke="#16a34a" stroke-width="2" />
  </g>

  <!-- Big Fluffy Quilted Bed Cover (Folded & Voluminous) -->
  <g filter="url(#shadowBed)">
    <!-- Base Layer -->
    <path d="M 90 200 Q 200 215 310 200 L 315 170 Q 200 180 85 170 Z" fill="#9333ea" />
    <!-- Fluffy Quilt Folds -->
    <path d="M 85 170 Q 200 185 315 170 L 310 140 Q 200 150 90 140 Z" fill="#a855f7" />
    <path d="M 90 140 Q 200 155 310 140 L 305 110 Q 200 120 95 110 Z" fill="#c084fc" />
    <path d="M 95 110 Q 200 125 305 110 L 300 80 Q 200 90 100 80 Z" fill="#e9d5ff" stroke="#c084fc" stroke-width="1.5" />

    <!-- Quilted Diamond Stitch Pattern -->
    <line x1="120" y1="85" x2="160" y2="105" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3,3" />
    <line x1="180" y1="85" x2="220" y2="105" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3,3" />
    <line x1="240" y1="85" x2="280" y2="105" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3,3" />
    <line x1="160" y1="85" x2="120" y2="105" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3,3" />
    <line x1="220" y1="85" x2="180" y2="105" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3,3" />
    <line x1="280" y1="85" x2="240" y2="105" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3,3" />
    
    <!-- Fluffy Pillow Resting on Top -->
    <path d="M 140 85 Q 200 60 260 85 Q 265 100 255 105 Q 200 90 145 105 Q 135 100 140 85 Z" fill="#ffffff" stroke="#e9d5ff" stroke-width="2" />
    <!-- Pillow Indent -->
    <circle cx="200" cy="85" r="3" fill="#cbd5e1" />
  </g>

  <!-- Sparkles & Aroma Waves -->
  <polygon points="120,60 123,66 130,68 123,71 120,78 117,71 110,68 117,66" fill="#f59e0b" />
  <polygon points="280,60 282,65 288,67 282,69 280,75 278,69 272,67 278,65" fill="#a855f7" />

  <!-- Badge -->
  <rect x="95" y="15" width="210" height="30" rx="15" fill="#7e22ce" />
  <text x="200" y="35" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#ffffff">CUCI HIGIENIS • BEBAS TUNGAU</text>
</svg>
