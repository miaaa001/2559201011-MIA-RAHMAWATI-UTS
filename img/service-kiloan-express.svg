<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <defs>
    <linearGradient id="bgKiloanExp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <filter id="shadowExp" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#d97706" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="400" height="250" fill="url(#bgKiloanExp)" />

  <!-- Speed Motion Lines in Background -->
  <line x1="30" y1="80" x2="110" y2="80" stroke="#fcd34d" stroke-width="4" stroke-linecap="round" />
  <line x1="20" y1="120" x2="80" y2="120" stroke="#fcd34d" stroke-width="4" stroke-linecap="round" />
  <line x1="40" y1="160" x2="120" y2="160" stroke="#fcd34d" stroke-width="4" stroke-linecap="round" />

  <!-- Express 24H Stopwatch / Clock Graphic -->
  <g filter="url(#shadowExp)">
    <!-- Stopwatch Button Top -->
    <rect x="135" y="55" width="20" height="12" rx="3" fill="#64748b" />
    <!-- Outer Watch Body -->
    <circle cx="145" cy="140" r="60" fill="#ffffff" stroke="#f59e0b" stroke-width="5" />
    <circle cx="145" cy="140" r="50" fill="#fffbeb" stroke="#fde68a" stroke-width="2" />
    <!-- Clock Hands (Fast 24H) -->
    <circle cx="145" cy="140" r="4" fill="#0f172a" />
    <line x1="145" y1="140" x2="145" y2="105" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
    <line x1="145" y1="140" x2="170" y2="140" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" />
    <!-- Clock hour dots -->
    <circle cx="145" cy="95" r="2.5" fill="#f59e0b" />
    <circle cx="145" cy="185" r="2.5" fill="#f59e0b" />
    <circle cx="100" cy="140" r="2.5" fill="#f59e0b" />
    <circle cx="190" cy="140" r="2.5" fill="#f59e0b" />
    <!-- Text Inside Clock -->
    <text x="145" y="165" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="900" fill="#d97706">24 JAM</text>
  </g>

  <!-- Clean Folded Laundry with Lightning Bolt -->
  <g filter="url(#shadowExp)">
    <!-- Clothes Stack -->
    <rect x="235" y="155" width="115" height="26" rx="6" fill="#0284c7" />
    <rect x="240" y="130" width="105" height="26" rx="6" fill="#f59e0b" />
    <rect x="245" y="105" width="95" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Big Lightning Bolt Overlay -->
    <polygon points="315,60 285,115 305,115 290,165 335,100 310,100" fill="#f59e0b" stroke="#ffffff" stroke-width="2" />
  </g>

  <!-- Top Badge -->
  <rect x="105" y="15" width="190" height="30" rx="15" fill="#f59e0b" />
  <text x="200" y="35" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#ffffff">EXPRESS • SELESAI 1 HARI</text>
</svg>
