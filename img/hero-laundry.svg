<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="washerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="drumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="basketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="450" rx="24" fill="url(#bgGrad)" />

  <!-- Floor line -->
  <line x1="40" y1="390" x2="560" y2="390" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />

  <!-- Floating Bubbles & Sparkles in Background -->
  <circle cx="90" cy="110" r="18" fill="#bae6fd" opacity="0.6" />
  <circle cx="102" cy="100" r="6" fill="#ffffff" opacity="0.8" />
  <circle cx="510" cy="90" r="26" fill="#bae6fd" opacity="0.5" />
  <circle cx="525" cy="80" r="8" fill="#ffffff" opacity="0.8" />
  <circle cx="480" cy="170" r="14" fill="#38bdf8" opacity="0.4" />
  <circle cx="120" cy="220" r="12" fill="#7dd3fc" opacity="0.5" />

  <!-- Star sparkles -->
  <polygon points="170,80 173,88 181,91 173,94 170,102 167,94 159,91 167,88" fill="#f59e0b" />
  <polygon points="430,60 432,66 438,68 432,70 430,76 428,70 422,68 428,66" fill="#f59e0b" />
  <polygon points="460,330 462,335 467,337 462,339 460,344 458,339 453,337 458,335" fill="#0284c7" />

  <!-- Modern Front-Loading Washing Machine -->
  <g filter="url(#shadow)">
    <!-- Main Outer Casing -->
    <rect x="180" y="110" width="220" height="270" rx="18" fill="url(#washerGrad)" stroke="#cbd5e1" stroke-width="3" />
    
    <!-- Top Control Panel -->
    <rect x="195" y="125" width="190" height="45" rx="8" fill="#f1f5f9" />
    <!-- Digital Screen -->
    <rect x="210" y="135" width="55" height="25" rx="4" fill="#0f172a" />
    <text x="218" y="152" font-family="monospace" font-size="12" font-weight="bold" fill="#38bdf8">00:45</text>
    <!-- Dial Knob -->
    <circle cx="310" cy="147" r="14" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />
    <circle cx="310" cy="147" r="9" fill="#0284c7" />
    <line x1="310" y1="138" x2="310" y2="143" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <!-- Power & Mode Buttons -->
    <circle cx="350" cy="147" r="6" fill="#10b981" />
    <circle cx="370" cy="147" r="6" fill="#0284c7" />

    <!-- Detergent Drawer -->
    <rect x="195" y="180" width="70" height="18" rx="4" fill="#e2e8f0" />
    <rect x="220" y="185" width="20" height="4" rx="2" fill="#94a3b8" />

    <!-- Big Drum Door -->
    <circle cx="290" cy="275" r="75" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="4" />
    <circle cx="290" cy="275" r="64" fill="url(#drumGrad)" />
    <!-- Inner Glass reflection & Water Waves -->
    <path d="M 235 285 Q 265 265 290 285 T 345 285 A 64 64 0 0 1 235 285" fill="#0284c7" opacity="0.6" />
    <ellipse cx="270" cy="245" rx="35" ry="16" fill="#ffffff" opacity="0.3" transform="rotate(-30 270 245)" />
    <!-- Door Handle -->
    <rect x="350" y="260" width="10" height="30" rx="5" fill="#64748b" />
  </g>

  <!-- Laundry Basket with Fresh Clothes (Left) -->
  <g filter="url(#shadow)">
    <!-- Clothes Piles in Basket -->
    <path d="M 90 290 Q 115 250 140 285 Q 160 260 175 290 Z" fill="#38bdf8" />
    <path d="M 105 280 Q 130 245 150 280 Z" fill="#ffffff" />
    <path d="M 125 285 Q 145 260 165 285 Z" fill="#f43f5e" />
    <!-- Basket Body -->
    <path d="M 85 295 L 98 385 L 172 385 L 185 295 Z" fill="url(#basketGrad)" />
    <!-- Basket Weave Lines -->
    <line x1="93" y1="320" x2="177" y2="320" stroke="#d97706" stroke-width="2.5" />
    <line x1="96" y1="350" x2="174" y2="350" stroke="#d97706" stroke-width="2.5" />
    <line x1="115" y1="298" x2="115" y2="382" stroke="#d97706" stroke-width="2" />
    <line x1="140" y1="298" x2="140" y2="382" stroke="#d97706" stroke-width="2" />
  </g>

  <!-- Stack of Neatly Folded Clean Towels (Right) -->
  <g filter="url(#shadow)">
    <!-- Towel 1 (Bottom - Blue) -->
    <rect x="420" y="350" width="110" height="28" rx="8" fill="#0284c7" />
    <!-- Towel 2 (Middle - Cyan) -->
    <rect x="425" y="325" width="100" height="27" rx="8" fill="#38bdf8" />
    <!-- Towel 3 (Top - White) -->
    <rect x="430" y="300" width="90" height="27" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <!-- Lavender Scent / Sparkle on Towel -->
    <polygon points="475,275 477,281 483,283 477,285 475,291 473,285 467,283 473,281" fill="#f59e0b" />
  </g>

  <!-- Floating Trust Badge 1: 1 Mesin 1 Pelanggan -->
  <g filter="url(#shadow)">
    <rect x="40" y="45" width="175" height="48" rx="14" fill="#ffffff" stroke="#bae6fd" stroke-width="2" />
    <circle cx="65" cy="69" r="15" fill="#e0f2fe" />
    <text x="59" y="74" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#0284c7">✓</text>
    <text x="88" y="62" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#0f172a">100% Higienis</text>
    <text x="88" y="78" font-family="'Segoe UI', sans-serif" font-size="10" fill="#64748b">1 Mesin 1 Pelanggan</text>
  </g>

  <!-- Floating Trust Badge 2: Express 24 Jam -->
  <g filter="url(#shadow)">
    <rect x="400" y="210" width="170" height="48" rx="14" fill="#ffffff" stroke="#fde68a" stroke-width="2" />
    <circle cx="424" cy="234" r="14" fill="#fef3c7" />
    <text x="419" y="239" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#d97706">⚡</text>
    <text x="446" y="228" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Layanan Express</text>
    <text x="446" y="244" font-family="'Segoe UI', sans-serif" font-size="10" fill="#64748b">Selesai 24 Jam Pasti</text>
  </g>
</svg>
