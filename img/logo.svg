<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 70" width="280" height="70">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2" />
    </linearGradient>
  </defs>
  <!-- Icon Background -->
  <rect x="5" y="8" width="54" height="54" rx="14" fill="url(#logoGrad)" />
  <!-- Washing Machine Body -->
  <rect x="15" y="16" width="34" height="38" rx="6" fill="#ffffff" />
  <!-- Control Panel -->
  <circle cx="23" cy="22" r="2.5" fill="#0284c7" />
  <circle cx="31" cy="22" r="2" fill="#06b6d4" />
  <circle cx="38" cy="22" r="2" fill="#f59e0b" />
  <!-- Drum Door -->
  <circle cx="32" cy="37" r="11" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5" />
  <circle cx="32" cy="37" r="7" fill="#0284c7" />
  <path d="M 28 35 Q 32 31 36 35 Q 32 39 28 35" fill="#ffffff" opacity="0.9" />
  <!-- Sparkles -->
  <polygon points="56,6 58,11 63,13 58,15 56,20 54,15 49,13 54,11" fill="#f59e0b" />
  <!-- Text Brand -->
  <text x="68" y="38" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="24" font-weight="800" fill="#0f172a">Klin<tspan fill="#0284c7">Wash</tspan></text>
  <text x="69" y="54" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#f59e0b">LAUNDRY EXPRESS</text>
</svg>
